name: Update Sileo Repo Indexes

on:
  push:
    branches: [ main ]
    paths:
      - 'debs/**'
      - '.github/workflows/update-repo.yml'
  workflow_dispatch:            # lets you run it manually from Actions tab too
  workflow_run:
    workflows:                  # glob patterns, so names containing "+" must not be listed literally
      - "Build *"
      - "Fetch *"
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # queue runs so two never push at once

permissions:
  contents: write               # needed to commit the updated Packages/Release back

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so git commit works nicely

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY secret not set — skipping signing"
            echo "HAVE_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          # Non-interactive signing for gpg and tools that call it (debsigs)
          printf 'batch\npinentry-mode loopback\npassphrase-file %s\ndigest-algo SHA512\n' "$GNUPGHOME/passphrase" > "$GNUPGHOME/gpg.conf"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "$GPG_PRIVATE_KEY" | gpg --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          KEY_CREATED=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $6; exit}')
          KEY_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          # Publish the public key so users can verify the repo
          gpg --armor --export "$KEY_ID" > silko.asc
          {
            echo "HAVE_KEY=true"
            echo "GNUPGHOME=$GNUPGHOME"
            echo "KEY_ID=$KEY_ID"
            echo "KEY_CREATED=$KEY_CREATED"
            echo "KEY_FPR=$KEY_FPR"
          } >> "$GITHUB_ENV"

      - name: Build keyring package
        if: env.HAVE_KEY == 'true'
        run: |
          # Version comes from the key's creation date, so it only changes with a new key
          VERSION=$(date -u -d "@${KEY_CREATED}" +%Y.%m.%d)
          for target in "iphoneos-arm64 /var/jb" "iphoneos-arm "; do
            read -r arch prefix <<< "$target"
            out="debs/silko-keyring_${VERSION}_${arch}.deb"
            if [ -f "$out" ]; then
              echo "${out} already exists"
              continue
            fi
            root=$(mktemp -d)
            chmod 755 "$root"
            mkdir -p "$root/DEBIAN" "$root${prefix}/etc/apt/trusted.gpg.d"
            gpg --dearmor < silko.asc > "$root${prefix}/etc/apt/trusted.gpg.d/silko.gpg"
            chmod 644 "$root${prefix}/etc/apt/trusted.gpg.d/silko.gpg"
            size=$(du -sk --exclude=DEBIAN "$root" | cut -f1)
            cat > "$root/DEBIAN/control" << EOF
          Package: silko-keyring
          Name: Silko Keyring
          Version: ${VERSION}
          Architecture: ${arch}
          Installed-Size: ${size}
          Maintainer: Kyle
          Author: Kyle
          Homepage: https://github.com/${{ github.repository }}
          Section: Repo Managers
          Description: Installs the Silko signing key so apt can verify the repo
          EOF
            sed -i 's/^ *//' "$root/DEBIAN/control"
            dpkg-deb --root-owner-group -Zgzip -b "$root" "$out"
            rm -rf "$root"
          done

      - name: Remove old versions of debs
        run: |
          # Keep only the newest version of each package per architecture
          declare -A newest_ver newest_file
          for deb in debs/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            key="${pkg}|${arch}"
            if [ -z "${newest_ver[$key]}" ]; then
              newest_ver[$key]=$ver
              newest_file[$key]=$deb
            elif dpkg --compare-versions "$ver" gt "${newest_ver[$key]}"; then
              echo "Removing old ${newest_file[$key]} (superseded by ${deb})"
              rm -f "${newest_file[$key]}"
              newest_ver[$key]=$ver
              newest_file[$key]=$deb
            else
              echo "Removing old ${deb} (superseded by ${newest_file[$key]})"
              rm -f "$deb"
            fi
          done

      - name: Sign debs (debsigs origin signature)
        if: env.HAVE_KEY == 'true'
        run: |
          # Same format as debsigs: a detached signature over debian-binary,
          # control.tar.* and data.tar.* stored as a _gpgorigin member.
          # Done by hand because debsigs doesn't recognise .zst members.
          for deb in debs/*.deb; do
            members=$(ar t "$deb" | grep -v '^_gpg')
            if ar t "$deb" | grep -qx '_gpgorigin'; then
              sig=$(mktemp)
              ar p "$deb" _gpgorigin > "$sig"
              # Skip debs already signed by the current key
              if for m in $members; do ar p "$deb" "$m"; done \
                  | gpg --status-fd 1 --verify "$sig" - 2>/dev/null | grep -q "VALIDSIG.*${KEY_ID}"; then
                rm -f "$sig"
                continue
              fi
              rm -f "$sig"
              ar d "$deb" _gpgorigin
            fi
            echo "Signing ${deb}"
            dir=$(mktemp -d)
            for m in $members; do ar p "$deb" "$m"; done \
              | gpg --openpgp --local-user "$KEY_ID" --detach-sign --output "$dir/_gpgorigin"
            ar r "$deb" "$dir/_gpgorigin"
            rm -rf "$dir"
          done

      - name: Generate Packages file
        run: |
          dpkg-scanpackages --arch iphoneos-arm debs > Packages || true
          dpkg-scanpackages --arch iphoneos-arm64 debs >> Packages || true

      - name: Set minimum iOS tags from binaries
        run: |
          python3 - << 'PY'
          import io, re, struct, subprocess, tarfile

          def minos(data):
              """Minimum iOS versions recorded in a Mach-O (thin or fat) binary."""
              magic = struct.unpack("<I", data[:4])[0]
              if magic == 0xBEBAFECA:  # fat: a device loads the slice it supports, so take the lowest
                  found = []
                  for i in range(struct.unpack(">I", data[4:8])[0]):
                      _, _, off, size, _ = struct.unpack(">5I", data[8 + i * 20:28 + i * 20])
                      found += minos(data[off:off + size])
                  return [min(found)] if found else []
              if magic not in (0xFEEDFACF, 0xFEEDFACE):
                  return []
              ncmds = struct.unpack("<I", data[16:20])[0]
              pos = 32 if magic == 0xFEEDFACF else 28
              found = []
              for _ in range(ncmds):
                  cmd, size = struct.unpack("<II", data[pos:pos + 8])
                  if cmd == 0x32 and struct.unpack("<I", data[pos + 8:pos + 12])[0] == 2:  # LC_BUILD_VERSION, iOS
                      found.append(struct.unpack("<I", data[pos + 12:pos + 16])[0])
                  elif cmd == 0x25:  # LC_VERSION_MIN_IPHONEOS
                      found.append(struct.unpack("<I", data[pos + 8:pos + 12])[0])
                  pos += size
              return found

          def deb_minos(path):
              tar = subprocess.run(["dpkg-deb", "--fsys-tarfile", path], capture_output=True, check=True).stdout
              versions = []
              with tarfile.open(fileobj=io.BytesIO(tar)) as t:
                  for member in t:
                      if member.isfile() and member.size >= 32:
                          versions += minos(t.extractfile(member).read())
              return max(versions) if versions else None

          stanzas = open("Packages").read().strip().split("\n\n")
          for n, stanza in enumerate(stanzas):
              fields = dict(re.findall(r"^([\w-]+): (.*)$", stanza, re.M))
              version = deb_minos(fields["Filename"])
              if version is None:
                  continue
              if fields["Architecture"] == "iphoneos-arm64":
                  version = max(version, 15 << 16)  # rootless jailbreaks start at iOS 15
              minimum = f"compatible_min::ios{version >> 16}.{(version >> 8) & 0xFF}"
              tags = [t for t in fields.get("Tag", "").split(", ") if t and not t.startswith("compatible_min::")]
              tag_line = "Tag: " + ", ".join(tags + [minimum])
              if "Tag" in fields:
                  stanza = re.sub(r"^Tag: .*$", tag_line, stanza, flags=re.M)
              else:
                  stanza += "\n" + tag_line
              stanzas[n] = stanza
              print(f"{fields['Package']} ({fields['Architecture']}): {minimum}")

          open("Packages", "w").write("\n\n".join(stanzas) + "\n\n")
          PY

      - name: Add SHA512 to Packages
        run: |
          # dpkg-scanpackages only writes MD5sum/SHA1/SHA256; add SHA512 after SHA256
          awk '
            /^Filename: / { file = substr($0, 11) }
            { print }
            /^SHA256: / {
              cmd = "sha512sum \"" file "\""
              cmd | getline out
              close(cmd)
              split(out, h, " ")
              print "SHA512: " h[1]
            }
          ' Packages > Packages.new
          mv Packages.new Packages

      - name: Strip unwanted fields from Packages
        run: |
          sed -i '/^Header:/d; /^Icon:/d; /^SileoDepiction:/d; /^Native-Depiction:/d' Packages

      - name: Compress Packages (zst, xz, bz2, gz)
        run: |
          # -k = keep original, -f = force overwrite
          command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zstd)
          zstd -q -19 -k -f Packages
          xz -9 -k -f Packages
          bzip2 -9 -k -f Packages
          gzip -9 -n -k -f Packages

      - name: (Optional) Update Release file hashes
        run: |
          # Simple static Release — you can make this dynamic if needed
          cat > Release << EOF
          Origin: Silko
          Label: Silko
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64
          Components: main
          Description: Personal repo with tweaks
          Date: $(date -Ru)
          EOF

          # Only this key may sign future Release files (newer apt enforces it)
          if [ -n "$KEY_FPR" ]; then
            echo "Signed-By: ${KEY_FPR}" >> Release
          fi

          # Add MD5/SHA256/SHA512 of Packages* with proper Debian format: hash size filename
          echo "MD5Sum:" >> Release
          for f in Packages Packages.zst Packages.xz Packages.bz2 Packages.gz; do
            hash=$(md5sum "$f" | awk '{print $1}')
            size=$(wc -c < "$f" | tr -d ' ')
            echo " ${hash} ${size} ${f}" >> Release
          done

          echo "SHA256:" >> Release
          for f in Packages Packages.zst Packages.xz Packages.bz2 Packages.gz; do
            hash=$(sha256sum "$f" | awk '{print $1}')
            size=$(wc -c < "$f" | tr -d ' ')
            echo " ${hash} ${size} ${f}" >> Release
          done

          echo "SHA512:" >> Release
          for f in Packages Packages.zst Packages.xz Packages.bz2 Packages.gz; do
            hash=$(sha512sum "$f" | awk '{print $1}')
            size=$(wc -c < "$f" | tr -d ' ')
            echo " ${hash} ${size} ${f}" >> Release
          done

      - name: Sign Release (InRelease + Release.gpg)
        if: env.HAVE_KEY == 'true'
        run: |
          gpg --yes --local-user "$KEY_ID" --clearsign --output InRelease Release
          gpg --yes --local-user "$KEY_ID" --armor --detach-sign --output Release.gpg Release
          gpg --verify InRelease
          gpg --verify Release.gpg Release

      - name: Commit updated indexes back to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add Packages Packages.zst Packages.xz Packages.bz2 Packages.gz Release || true
          git add InRelease Release.gpg silko.asc 2>/dev/null || true
          git add -A debs/
          git commit -m "chore: prune old debs, update Packages indexes [ci skip]" || echo "No changes to commit"
          # Retry in case another workflow pushed at the same time
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in token works here

      - name: Remove GPG key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"
