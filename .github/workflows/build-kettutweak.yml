name: Build KettuTweak (Rootless + Rootful)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-kettutweak.yml'
  schedule:
    - cron: "0 12 * * 0" # weekly check every Sunday at noon UTC
  workflow_dispatch:
    inputs:
      commit_id:
        description: "(Optional) KettuTweak commit ID to build at"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KettuTweak (${{ matrix.mode }})
    runs-on: macos-14
    permissions:
      contents: write

    strategy:
      matrix:
        mode: [rootless, rootfull]

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Checkout C0C0B01/KettuTweak
        uses: actions/checkout@v7
        with:
          repository: C0C0B01/KettuTweak
          ref: ${{ github.event.inputs.commit_id || 'main' }}
          path: main
          submodules: true

      - name: Install Dependencies
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Get KettuTweak Version
        run: |
          BTLOADER_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "BTLOADER_VERSION=${BTLOADER_VERSION}" >> "$GITHUB_ENV"
          echo "$BTLOADER_VERSION"

      - name: Build Package (${{ matrix.mode }})
        run: |
          cd ${{ github.workspace }}/main
          if [ "${{ matrix.mode }}" = "rootfull" ]; then
            sed -i '' '/^THEOS_PACKAGE_SCHEME/d' Makefile
            unset THEOS_PACKAGE_SCHEME
            make package FINALPACKAGE=1
          else
            export THEOS_PACKAGE_SCHEME=rootless
            make package FINALPACKAGE=1
          fi
        env:
          THEOS_PACKAGE_SCHEME: ${{ matrix.mode == 'rootfull' && '' || 'rootless' }}

      - name: Get package filename
        id: package_name
        run: |
          echo "package=$(ls -t main/packages/*.deb | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: KettuTweak-${{ matrix.mode }}_${{ env.BTLOADER_VERSION }}
          path: ${{ steps.package_name.outputs.package }}
          if-no-files-found: error

      - name: Upload deb for commit job
        uses: actions/upload-artifact@v7
        with:
          name: kettutweak-deb-${{ matrix.mode }}
          path: ${{ steps.package_name.outputs.package }}

  commit-debs:
    name: Commit .debs to repo
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download rootless deb
        uses: actions/download-artifact@v8
        with:
          name: kettutweak-deb-rootless
          path: debs/

      - name: Download rootfull deb
        uses: actions/download-artifact@v8
        with:
          name: kettutweak-deb-rootfull
          path: debs/

      - name: Commit new .debs
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add debs/*.deb
          git commit -m "chore: add KettuTweak rootless + rootfull debs [ci skip]" || echo "No changes to commit"
          # Retry in case another workflow pushed at the same time
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 5 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
